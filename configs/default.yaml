# Default system configuration for Agri-Drift

system:
  mode: "simulation"  # "simulation" or "hardware"
  sampling_interval_minutes: 15
  random_seed: 42

sensors:
  target_sensors: ["sensor_1", "sensor_2", "sensor_3", "sensor_4"]
  soil_type: "sandy_loam"
  field_capacity_vwc: 36.0
  wilting_point_vwc: 10.0
  valid_range:
    min_vwc: 3.0
    max_vwc: 55.0
  max_rate_of_change_per_step: 8.0  # % VWC per 15-minute step

detectors:
  threshold:
    enabled: true
    min_vwc: 3.0
    max_vwc: 55.0
    max_rate: 8.0

  neighbour:
    enabled: true
    model_type: "ols"
    min_reference_sensors: 2
    contamination_masking: true

  cusum:
    enabled: true
    allowance_k_sigma: 0.5   # k parameter in multiples of baseline std sigma_0
    threshold_h_sigma: 5.0   # h decision boundary in multiples of sigma_0
    two_sided: true
    reset_on_alert: true

  page_hinkley:
    enabled: true
    delta_sigma: 0.5         # minimum change magnitude
    lambda_sigma: 15.0       # detection threshold
    alpha: 0.99              # forgetting factor

  physics:
    enabled: true
    response_window_hours: 4.0
    min_expected_response_vwc: 1.5   # minimum expected rise after rain/irrigation
    suspicion_increment: 0.35
    suspicion_decay: 0.10
    suspicion_threshold: 0.70

hybrid:
  confirmation_window_steps: 3
  recovery_window_steps: 5
  deduplication_window_steps: 4

storage:
  database_path: "data/agri_drift.db"

alerts:
  console: true
  database: true
  telegram:
    enabled: false
    token_env_var: "AGRI_TELEGRAM_BOT_TOKEN"
    chat_id_env_var: "AGRI_TELEGRAM_CHAT_ID"
